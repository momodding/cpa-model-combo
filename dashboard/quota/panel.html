    <section id="quota-panel" class="tab-panel" role="tabpanel" aria-labelledby="quota-tab" hidden>
      <section class="fallback-settings" aria-labelledby="quota-polling-title">
        <div class="section-head"><div class="section-title"><h2 id="quota-polling-title">Quota polling</h2></div></div>
        <div class="field-grid">
          <div class="field"><label for="quota-unknown-percent">Unknown quota score (%)</label><input id="quota-unknown-percent" type="number" min="0" max="100" step="any" data-quota-field="default_unknown_quota_percent"><small>Routing score for accounts without fresh quota data. Not a provider measurement.</small></div>
          <div class="field"><label for="quota-refresh">Refresh seconds</label><input id="quota-refresh" type="number" min="1" step="1" data-quota-field="refresh_seconds"></div>
          <div class="field"><label for="quota-idle">Idle seconds</label><input id="quota-idle" type="number" min="1" step="1" data-quota-field="idle_seconds"></div>
          <div class="field"><label for="quota-ttl">TTL seconds</label><input id="quota-ttl" type="number" min="1" step="1" data-quota-field="ttl_seconds"></div>
          <div class="field"><label for="quota-stale">Maximum backoff (seconds)</label><input id="quota-stale" type="number" min="1" step="1" data-quota-field="max_stale_seconds"></div>
          <div class="field"><label for="quota-timeout">Fetch timeout seconds</label><input id="quota-timeout" type="number" min="1" step="1" data-quota-field="fetch_timeout_seconds"></div>
          <div class="field"><label for="quota-concurrent">Max concurrent fetches</label><input id="quota-concurrent" type="number" min="1" step="1" data-quota-field="max_concurrent"></div>
          <div class="field"><label for="quota-wait">Cold wait milliseconds</label><input id="quota-wait" type="number" min="1" step="1" data-quota-field="cold_wait_ms"></div>
        </div>
      </section>

      <section class="fallback-settings" aria-labelledby="quota-status-title">
        <div class="section-head"><div class="section-title"><h2 id="quota-status-title">Quota status</h2></div></div>
        <div id="quota-status" aria-live="polite">Loading quota status…</div>
      </section>
    </section>
